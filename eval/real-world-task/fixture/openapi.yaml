openapi: 3.0.3
info:
  title: Echo API
  version: 1.0.0
servers:
  - url: http://127.0.0.1:18080
paths:
  /echo/{id}:
    get:
      operationId: getEcho
      summary: Return an echo payload
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: ok
          content:
            application/json:
              schema:
                type: object
                properties:
                  id:
                    type: string
                  message:
                    type: string
